 * Theme über prefers-color-scheme (Standard) und [data-theme]-Override (bewusste

:root {
  /* --- Primitives: warmer Graustufen-Grundton (nicht neutral-kalt wie ein UI-Grau) --- */
  --stone-25:  #FCFBF9;  --stone-50:  #F7F5F1;  --stone-100: #EFEBE3;
  --stone-200: #E1DACB;  --stone-300: #CBC0A9;  --stone-400: #A69A7C;
  --stone-500: #837759;  --stone-600: #665C42;  --stone-700: #4C4430;
  --stone-800: #33301F;  --stone-900: #201E13;  --stone-950: #14130C;

  /* --- Primitives: Akzent (gebranntes Terrakotta, bewusst nicht Blau/Violett) --- */
  --amber-50:  #FDF3EC;  --amber-100: #FAE1CE;  --amber-300: #EDA96C;
  --amber-500: #C96A2E;  --amber-600: #AD5522;  --amber-700: #8B441C;

  /* --- Primitives: Richtung/Status, farbenblind-sicher als Paar --- */
  --green-600: #29785A;  --green-50: #EAF5EE;
  --red-600:   #B7402F;  --red-50:  #FBECE9;

  /* --- Semantisch: Flächen --- */
  --bg-page: var(--stone-25);
  --bg-surface: #FFFFFF;
  --bg-subtle: var(--stone-50);
  --bg-callout: var(--amber-50);

  /* --- Semantisch: Text --- */
  --text-strong: var(--stone-900);
  --text-default: var(--stone-700);
  --text-muted: var(--stone-500);
  --text-on-accent: #FFFFFF;

  /* --- Semantisch: Rahmen --- */
  --border-subtle: var(--stone-200);
  --border-default: var(--stone-300);

  /* --- Semantisch: Akzent --- */
  --accent: var(--amber-500);
  --accent-strong: var(--amber-700);
  --accent-subtle: var(--amber-100);

  /* --- Semantisch: Richtung (Chart-Farbpaar, nie alleiniges Signal) --- */
  --up: var(--green-600);
  --down: var(--red-600);
  --up-subtle: var(--green-50);
  --down-subtle: var(--red-50);

  /* --- Referenzmarken --- */
  --ref-mark: var(--accent-strong);

  /* --- Radius & Schatten: dezent, kein AI-Weichzeichner-Look --- */
  --radius-sm: 3px; --radius-md: 6px; --radius-lg: 10px;
  --shadow-card: 0 1px 2px rgba(32,30,19,.06), 0 1px 1px rgba(32,30,19,.08);

  /* --- Typografie: Serife für Headlines, Sans für Fließtext, Mono für Zahlen --- */
  --font-serif: Iowan Old Style, "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
  --font-sans: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --size-headline: clamp(1.6rem, 1.3rem + 1.2vw, 2.4rem);
  --size-h2: 1.15rem;
  --size-body: 1rem;
  --size-caption: 0.85rem;
  --leading-body: 1.55;

  /* --- Abstände --- */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;

  /* --- Seitenrahmen (Ein-Seiten-Budget als Layoutgrenze, nicht nur Vorgabe) --- */
  --page-max-width: 760px;
}

    --ref-mark: var(--amber-300);
    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.45);
  }

}
